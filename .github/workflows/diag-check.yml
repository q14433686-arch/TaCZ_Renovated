name: diag-check

# 临时诊断工作流：把 `./gradlew check` 的完整输出回推到 build-reports/diag-check.log，
# 便于在无法读取 Actions 日志的环境里定位失败任务。定位完成后删除本文件与日志。

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-check.yml'

concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: gradle check
        run: |
          mkdir -p build-reports
          echo "commit: ${{ github.sha }}" > build-reports/diag-check.log
          ./gradlew check --continue --console=plain --no-daemon >> build-reports/diag-check.log 2>&1
          echo "exit: $?" >> build-reports/diag-check.log

      - name: Push log back
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG=build-reports/diag-check.log
          echo "" >> "$LOG"
          echo "== job status: ${{ job.status }} ==" >> "$LOG"
          LINES=$(wc -l < "$LOG")
          if [ "$LINES" -gt 2000 ]; then
            { head -n 200 "$LOG"; echo "...[truncated]..."; tail -n 1500 "$LOG"; } > /tmp/t
            mv /tmp/t "$LOG"
          fi
          BRANCH="${{ github.ref_name }}"
          SHA=$(gh api "repos/${{ github.repository }}/contents/$LOG?ref=$BRANCH" --jq .sha 2>/dev/null || true)
          ARGS=(-X PUT "repos/${{ github.repository }}/contents/$LOG"
                -f message="diag: gradle check log"
                -f branch="$BRANCH"
                -f content="$(base64 -w0 "$LOG")")
          if [ -n "$SHA" ]; then ARGS+=(-f sha="$SHA"); fi
          gh api "${ARGS[@]}" --jq .commit.sha
