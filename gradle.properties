## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
# Keep as "tacz" so existing gun packs' >=1.1.8 dependency checks still resolve.
mod_id=tacz
# The human-readable display name for the mod.
mod_name=Timeless and Classics Zero
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=GPL-3.0-only
# The mod version. See https://semver.org/
#
# SemVer trap (charter 7.4): MUST use '+' build metadata, NEVER '-' pre-release.
# Gun packs check >=1.1.8; "1.1.8-neoforge..." is a pre-release and sorts BEFORE 1.1.8,
# so the check silently fails. "1.1.8+neoforge..." is build metadata and still satisfies >=1.1.8.
#
# Hotfix naming (unchanged since the R2 round): R<n> -> R<n>-hotfix -> R<n>-hotfix2 -> ...
# lower case, the ordinal is glued straight onto "hotfix" with no '.', '-' or '_' in between.
# Rationale: TaCZTweaks identifies this project by the version string, and an extra '-'
# would drag the rest into the SemVer pre-release segment, breaking the ">=1.1.8 must hold"
# precondition gun packs rely on.
mod_version=1.1.8+neoforge.26.3.R1
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.tacz.guns

# 26.1+ is unobfuscated. Do not add mappings / parchment / yarn configuration.
