# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx512M
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# 2026-10-05: NeoForge 26.3 is still BETA-ONLY on maven.neoforged.net. The line was
# re-pinned 26.3.0.7-beta -> 26.3.0.51-beta (maintainer's launcher auto-updated and the
# old pin broke at runtime: FML 12.0.8 removed ModConfig.Type.COMMON/SERVER, so a jar
# compiled against .7 crashed with NoSuchFieldError on .51). Maintainer-approved beta
# pinning policy unchanged; re-pin again when 26.3 goes release.
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version=26.3
# Keep the game range exact: this port is validated against the 26.3 rendering and registry APIs.
minecraft_version_range=[26.3]
# Four-segment scheme: 26.3.0.51-beta = MC 26.3 + NeoForge build 51, beta channel.
neo_version=26.3.0.51-beta
# The jar now requires the FML 12.0.8+ config API (ModConfig.Type.LOCAL/SYNCED);
# older NeoForge 26.3 betas (.0-.7, FML with COMMON/SERVER only) are binary-incompatible.
neo_version_range=[26.3.0.51-beta,)

