# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx512M
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# 2026-09-21: NeoForge 26.3 is BETA-ONLY on maven.neoforged.net (26.3.0.0-beta .. 26.3.0.7-beta,
# no stable marker yet). Maintainer approved pinning the beta for the 26.3 line (same policy the
# Fabric sister line applied to its beta deps). Re-pin when 26.3 goes release.
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version=26.3
# Keep the game range exact: this port is validated against the 26.3 rendering and registry APIs.
minecraft_version_range=[26.3]
# Four-segment scheme: 26.3.0.7-beta = MC 26.3 + NeoForge build 7, beta channel.
neo_version=26.3.0.7-beta

# Optional 26.3 compatibility compile artifacts, pinned to loader-correct publications.
# maven.blamejared.com mezz/jei/jei-26.3-neoforge listing (2026-09-21): 31.0.0.5 .. 31.3.0.17.
# Pinned to 31.0.0.5 = the exact build the Fabric sister 26.3 line validated in-game
# (incl. the mezz.jei.common.Internal#restartJei reflection path); newer drops exist.
jei_neoforge_version=31.0.0.5
# Cloth Config 26.3 (maven.shedaniel.me, verified by the sister 26.3 plan on 2026-09-17).
cloth_config_neoforge_version=26.3.158
# ZigyTheBird Player Animation Library: 1.2.7+26.3 beta merged Fabric+NeoForge jar,
# resolved through the Modrinth maven (same coordinate the sister 26.3 line compiles against).
player_animation_lib_version=1.2.7

