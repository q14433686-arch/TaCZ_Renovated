plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
    // Optional recipe-viewer compile APIs. Runtime use remains conditional on the
    // corresponding mod being installed by the player.
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev"
    }
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me"
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.11, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java {
            // Work package ⑤: compile client animation/gltf APIs.
            // WP-LR2：LR 内置层已接线（安全阀已摘除，LR2-4）。
        }
    }
}

neoForge {
    // 1.21.11 is obfuscated — canonical MDG 2.x form for 1.21.x (MDK-1.21.11-ModDevGradle,
    // fetched 2026-08-22): version + parchment. The 26.x `enable {}` block does not exist
    // on this line. Mixin AP + refmap generation are wired automatically by ModDevGradle
    // when mixin configs are present (MDG ships a testproject mixin with no explicit AP config).
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            // Recommended logging level for the console
            logLevel = org.slf4j.event.Level.INFO

            // Keep low-memory CI/sandbox-friendly defaults; raise on dev machines if needed.
            jvmArguments.addAll '-Xms128M', '-Xmx640M'
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// WP-12111: REI and Controllable are libs/-only compileOnly deps (their 1.21.11
// NeoForge jars are not published on any maven — verified by a user build log).
// Without them, javac drowns in unrelated "package does not exist" errors across
// compat/rei and compat/controllable. Fail loudly here with exact sources instead.
// Config-cache safe: the libs/ directory is captured as a plain java.io.File at
// configuration time; the execution closure only does plain Java IO (calling the
// Gradle fileTree() model method inside doLast is forbidden under config cache).
def compatLibsDir = new File(projectDir, 'libs')
def checkCompatLibs = tasks.register('checkCompatLibs') {
    doLast {
        def jars = compatLibsDir.listFiles({ File f, String n -> n.endsWith('.jar') } as FilenameFilter) ?: [] as File[]
        def missing = []
        if (!jars.any { it.name.startsWith('RoughlyEnoughItems') }) {
            missing << 'REI 1.21.11 NeoForge jar -> https://modrinth.com/mod/rei/versions?g=1.21.11&l=neoforge'
        }
        if (!jars.any { it.name.startsWith('controllable-neoforge-1.21.11') }) {
            missing << 'Controllable NeoForge jar -> https://github.com/MrCrayfish/Controllable/releases/download/v1.21.11-0.25.8/controllable-neoforge-1.21.11-0.25.8-signed.jar'
        }
        if (!missing.isEmpty()) {
            throw new GradleException('Missing libs/ compileOnly jar(s):\n  - ' + missing.join('\n  - '))
        }
    }
}
tasks.named('compileJava') { dependsOn checkCompatLibs }

// Vendored runtime libs. `implementation files(...)` only puts them on the Gradle
// compile/run classpath — the published mod jar does NOT contain them, so a real
// launcher (PCL / Prism / vanilla NeoForge) crashes at construct:
//   NoClassDefFoundError: org/luaj/vm2/LuaError
//   at ModItems.<clinit> → ModernKineticGunItem (imports LuaError)
//
// ModDevGradle 2 refuses to jarJar a local file that has no JPMS name:
//   Cannot embed local file dependency ... because it has no explicit Java module name.
// Official MDG local-file example stamps Automatic-Module-Name on a Jar task, then
// `jarJar files(thatTask)`. We do the same for the two vendored jars (offline; no
// extra Maven fetch). Filename = artifact-id, MD5 = version.
def jarJarLocalLib = { String jarFileName, String moduleName ->
    def src = layout.projectDirectory.file("libs/${jarFileName}")
    return tasks.register("jarJarPrepare_${moduleName.replace('.', '_')}", Jar) {
        description = "Stamp Automatic-Module-Name=${moduleName} onto ${jarFileName} for FML jarJar"
        from { zipTree(src) }
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        archiveFileName.set(jarFileName)
        destinationDirectory.set(layout.buildDirectory.dir("jarjar-libs"))
        manifest {
            attributes(
                    'Automatic-Module-Name': moduleName,
                    'FMLModType': 'LIBRARY'
            )
        }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

def commonsMath3ForJarJar = jarJarLocalLib('commons-math3-3.6.1.jar', 'org.apache.commons.math3')
def luajForJarJar = jarJarLocalLib('luaj-jse-3.0.1.jar', 'org.luaj.vm2')

dependencies {
    implementation files("libs/commons-math3-3.6.1.jar")
    implementation files("libs/luaj-jse-3.0.1.jar")
    jarJar files(commonsMath3ForJarJar)
    jarJar files(luajForJarJar)

    // ----------------------------------------------------------------------
    // Optional compile APIs, 1.21.11 line (WP-12111-1). Each entry has a libs/
    // escape hatch that takes precedence: if the maven coordinate below fails to
    // resolve on a networked machine, drop the jar into libs/ and Gradle will use
    // it instead of the coordinate. Pin evidence: docs/records/PORT_12111_GATES.md
    // (sister project 1.21.11 phase-1 table, 2026-08-13; Controllable exact GitHub
    // release asset, 2026-08-22). These integrations are optional at runtime and
    // are discovered only when the corresponding mod is present.
    // ----------------------------------------------------------------------

    // JEI 27.23.x line. Runtime optional (modid jei).
    def localJei = fileTree(dir: 'libs', include: 'jei-1.21.11-neoforge-*.jar')
    if (!localJei.isEmpty()) {
        compileOnly localJei
    } else {
        compileOnly "mezz.jei:jei-1.21.11-neoforge:${jei_neoforge_version}"
    }

    // Roughly Enough Items 21.11.x line. Runtime optional (modid roughlyenoughitems).
    // libs/-ONLY (no maven coordinate): the NeoForge artifact is NOT published to
    // maven.shedaniel.me / Modrinth maven under the fabric version number 21.11.816
    // (user build log 2026-08-22: all 8 repos searched, not found). REI's own repo
    // confirms the 1.21.11 branch builds a neoforge module (platforms=fabric,neoforge),
    // so grab the 1.21.11 NeoForge jar from Modrinth and drop it into libs/:
    //   https://modrinth.com/mod/rei/versions?g=1.21.11&l=neoforge
    // (any RoughlyEnoughItems*.jar file name is picked up).
    def localRei = fileTree(dir: 'libs', include: 'RoughlyEnoughItems*.jar')
    compileOnly localRei
    compileOnly "dev.architectury:architectury-neoforge:${rei_architectury_version}"

    // Cloth Config 21.11.x line. Runtime optional (modid cloth_config).
    def localCloth = fileTree(dir: 'libs', include: 'cloth-config-*-neoforge*.jar')
    if (!localCloth.isEmpty()) {
        compileOnly localCloth
    } else {
        compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${rei_cloth_config_version}"
    }

    // ZigyTheBird Player Animation Library (PAL) — optional at runtime
    // (modid player_animation_library); drives TACZ third-person gun animations.
    // 1.21.11 line is 1.1.9 (26.1.2 used 1.2.5) — DOWN-version, API delta expected:
    // compat/playeranimator/** must be re-checked (sister phase-1 table, same note).
    // Escape hatch: drop PlayerAnimationLibMerged-1.1.9+1.21.11.jar (or any
    // PlayerAnimationLib*.jar) into libs/.
    def localPal = fileTree(dir: 'libs', include: 'PlayerAnimationLib*.jar')
    if (!localPal.isEmpty()) {
        compileOnly localPal
    } else {
        compileOnly "maven.modrinth:player-animation-library:${player_animation_lib_version}"
    }

    // MrCrayfish's Controllable 1.21.11-0.25.8 — optional at runtime (modid controllable);
    // controller bindings + gun-fire rumble. libs/-ONLY: Modrinth maven does not serve
    // the NeoForge jar under version "1.21.11-0.25.8" (user build log 2026-08-22).
    // Exact verified source (GitHub release tag + asset name checked 2026-08-22):
    //   https://github.com/MrCrayfish/Controllable/releases/download/v1.21.11-0.25.8/controllable-neoforge-1.21.11-0.25.8-signed.jar
    // DOWN-version from 26.1.2's 0.26.0 -> compat/controllable/** re-check.
    def localControllable = fileTree(dir: 'libs', include: 'controllable-neoforge-1.21.11*.jar')
    compileOnly localControllable

    // Exopandora's Shoulder Surfing Reloaded 5.x — optional at runtime
    // (modid shouldersurfing). 5.x API only: 4.x builds use a legacy plugin API and
    // fail closed at runtime. 1.21.11 line: 1.21.11-5.0.10+neoforge (sister pin:
    // fabric 5.0.10, Modrinth id 9T2YSavE).
    // Escape hatch: drop ShoulderSurfing-NeoForge-1.21.11*.jar into libs/.
    def localShoulderSurfing = fileTree(dir: 'libs', include: 'ShoulderSurfing-NeoForge-1.21.11*.jar')
    if (!localShoulderSurfing.isEmpty()) {
        compileOnly localShoulderSurfing
    } else {
        compileOnly "maven.modrinth:shoulder-surfing-reloaded:${shoulder_surfing_neoforge_version}"
    }

    // Iris (client dev profile) — the Iris mixins use string @Mixin(targets=...) only,
    // so NO compile dependency is needed here. For the runClient -PwithIris style
    // profile, drop iris-*.jar (1.10.7+mc1.21.11-neoforge) + sodium into libs/ and
    // add them to localRuntime. Carry On compat likewise has no compile dependency.
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
