plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
    // Modrinth maven: ZigyTheBird PAL publishes its merged Fabric+NeoForge jars here.
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    // Optional recipe-viewer compile APIs. Runtime use remains conditional on the
    // corresponding mod being installed by the player.
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev"
    }
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me"
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.2; the official 26.2 MDK keeps this toolchain.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        java {
            // 26.3 work package: compile client animation/gltf APIs.
            //
            // [Disabled integrations — no 26.3 artifacts, verified 2026-09-21]
            // Same policy as the Fabric sister 26.3 line: keep the facade classes,
            // exclude only the IMPL sources that hard-depend on APIs we cannot
            // compile against. This is a DISABLED state, not a fix; restore by
            // re-adding the compileOnly coordinate in gradle.properties/build.gradle
            // and dropping the matching exclude lines.
            //   REI (+Architectury)  — neoforge latest 26.2.820/26.2.821, no 26.3.
            //   Controllable         — latest 0.26.1+26.2, no 26.3.
            //   Shoulder Surfing     — latest 26.2-5.0.7, no 26.3.
            exclude 'com/tacz/guns/compat/rei/**'
            exclude 'com/tacz/guns/compat/controllable/ControllableInner.java'
            exclude 'com/tacz/guns/compat/shouldersurfing/ShoulderSurfingCompatInner.java'
            exclude 'com/tacz/guns/compat/shouldersurfing/ShoulderSurfingPlugin.java'
        }
    }
}

neoForge {
    // enable {} is the ModDevGradle 2.x settings object (ModdingVersionSettings).
    // disableRecompilation skips Vineflower (-Xmx4g by default in NeoForm 26.2),
    // which OOMs this 2 GiB sandbox. Dev machines with RAM can set it back to false
    // to get Minecraft sources attached in the IDE.
    enable {
        version = project.neo_version
        disableRecompilation = true
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            // Recommended logging level for the console
            logLevel = org.slf4j.event.Level.INFO

            // Vanilla 26.2 ships with a multi-gigabyte default heap. Override for low-memory CI/sandboxes.
            jvmArguments.addAll '-Xms128M', '-Xmx640M'
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Vendored runtime libs. `implementation files(...)` only puts them on the Gradle
// compile/run classpath — the published mod jar does NOT contain them, so a real
// launcher (PCL / Prism / vanilla NeoForge) crashes at construct:
//   NoClassDefFoundError: org/luaj/vm2/LuaError
//   at ModItems.<clinit> → ModernKineticGunItem (imports LuaError)
//
// ModDevGradle 2 refuses to jarJar a local file that has no JPMS name:
//   Cannot embed local file dependency ... because it has no explicit Java module name.
// Official MDG local-file example stamps Automatic-Module-Name on a Jar task, then
// `jarJar files(thatTask)`. We do the same for the two vendored jars (offline; no
// extra Maven fetch). Filename = artifact-id, MD5 = version.
def jarJarLocalLib = { String jarFileName, String moduleName ->
    def src = layout.projectDirectory.file("libs/${jarFileName}")
    return tasks.register("jarJarPrepare_${moduleName.replace('.', '_')}", Jar) {
        description = "Stamp Automatic-Module-Name=${moduleName} onto ${jarFileName} for FML jarJar"
        from { zipTree(src) }
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        archiveFileName.set(jarFileName)
        destinationDirectory.set(layout.buildDirectory.dir("jarjar-libs"))
        manifest {
            attributes(
                    'Automatic-Module-Name': moduleName,
                    'FMLModType': 'LIBRARY'
            )
        }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

def commonsMath3ForJarJar = jarJarLocalLib('commons-math3-3.6.1.jar', 'org.apache.commons.math3')
def luajForJarJar = jarJarLocalLib('luaj-jse-3.0.1.jar', 'org.luaj.vm2')

dependencies {
    implementation files("libs/commons-math3-3.6.1.jar")
    implementation files("libs/luaj-jse-3.0.1.jar")
    jarJar files(commonsMath3ForJarJar)
    jarJar files(luajForJarJar)

    // 26.3 recipe viewers: JEI 31.0.0.5 for NeoForge (jei-26.3-neoforge, beta channel —
    // the exact build the sister Fabric 26.3 line validated in-game).
    // REI has NO 26.3 artifact (neoforge latest 26.2.820, verified 2026-09-21):
    // compat/rei/** is excluded in sourceSets and the integration is disabled.
    compileOnly "mezz.jei:jei-26.3-neoforge:${jei_neoforge_version}"

    // Cloth Config — optional at runtime (config screen). 26.3.158.
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_neoforge_version}"

    // ZigyTheBird Player Animation Library (PAL) — optional at runtime
    // (modid player_animation_library); drives TACZ third-person gun animations.
    // 26.3: resolved from the Modrinth maven (1.2.7 = "1.2.7+26.3" beta merged
    // Fabric+NeoForge jar — the same artifact the sister 26.3 line compiles against).
    // NOTE: PAL's public version numbers include the game line ("1.2.7+26.3");
    // the Modrinth maven coordinate is the bare "1.2.7".
    // Escape hatch: drop the downloaded jar (PlayerAnimationLibMerged-*.jar)
    // into libs/ and Gradle will use it instead of the Modrinth maven.
    def localPal = fileTree(dir: 'libs', include: 'PlayerAnimationLib*.jar')
    if (!localPal.isEmpty()) {
        compileOnly localPal
    } else {
        compileOnly "maven.modrinth:player-animation-library:${player_animation_lib_version}"
    }

    // MrCrayfish's Controllable — DISABLED for 26.3: no 26.3 artifact (latest is
    // 0.26.1+26.2, verified 2026-09-21 on github MrCrayfish/Controllable releases).
    // ControllableInner is excluded in sourceSets; ControllableCompat is the disabled
    // facade. Restore: set controllable_neoforge_file, uncomment the block below,
    // drop the ControllableInner exclude.
    // def localControllable = fileTree(dir: 'libs', include: 'controllable-neoforge*.jar')
    // if (!localControllable.isEmpty()) {
    //     compileOnly localControllable
    // } else {
    //     compileOnly "curse.maven:controllable-317269:${controllable_neoforge_file}"
    // }

    // Exopandora's Shoulder Surfing Reloaded — DISABLED for 26.3: no 26.3 artifact
    // (latest 26.2-5.0.7). ShoulderSurfingCompatInner/ShoulderSurfingPlugin are excluded
    // in sourceSets; ShoulderSurfingCompat is the disabled facade; the bundled
    // shouldersurfing_plugin.json resource is archived under docs/patch/.
    // Restore: set shoulder_surfing_neoforge_file, uncomment, drop the two excludes,
    // restore src/main/resources/shouldersurfing_plugin.json from docs/patch/.
    // def localShoulderSurfing = fileTree(dir: 'libs', include: 'ShoulderSurfing-NeoForge*.jar')
    // if (!localShoulderSurfing.isEmpty()) {
    //     compileOnly localShoulderSurfing
    // } else {
    //     compileOnly "curse.maven:shoulder-surfing-reloaded-243190:${shoulder_surfing_neoforge_file}"
    // }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
