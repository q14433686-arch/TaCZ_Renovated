# FML mod metadata. Template source: official NeoForge MDK-1.21.11-ModDevGradle
# (fetched 2026-08-22; its key layout matches this file: license top-level,
# [[mods]] / [[mixins]] / [[accessTransformers]] / [[dependencies]]). Placeholders
# (dollar-brace, e.g. mod_id, mod_version) are expanded by generateModMetadata from
# gradle.properties.
# TRAP: this whole file -- comments included -- goes through the Groovy template
# engine. Never write a literal dollar-brace here unless it names a real property.
# 1.21.11 IS obfuscated: parchment + official mappings are configured in build.gradle
# (the 26.1.2 "no mappings" note no longer applies).

license="${mod_license}"
issueTrackerURL="https://github.com/q14433686-arch/TaCZ-Renovated/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
logoBlur=false
displayURL="https://github.com/q14433686-arch/TaCZ-Renovated"
credits="Original TaCZ: Serene Wave Studio / Timeless Squad. Unofficial ports: Sh1roCu (Fabric 1.21.1), q14433686-arch (Fabric 26.x), MUKSC (NeoForge 1.21.1). This tree is an unofficial NeoForge 1.21.11 port."
authors="Serene Wave Studio | Timeless Squad (original); unofficial NeoForge 1.21.11 port"
description='''
TaCZ: Renovated — Unofficial NeoForge port of Timeless and Classics Zero (TaCZ).

THIS IS UNOFFICIAL. Do not report bugs to the original authors
(MCModderAnchor / Serene Wave Studio). Report issues at the URL above.

Gun packs made for TaCZ 1.1.8 work as-is. Optional integrations: Cloth Config,
Iris, Player Animation Library, Controllable, Shoulder Surfing, JEI/REI.

Sibling project (Fabric 26.x / 1.21.11): TaCZ Refabricated Unofficial.
'''

[[mixins]]
config="tacz.mixins.json"

[[mixins]]
config="tacz.iris.mixins.json"

[[mixins]]
config="tacz.carryon.mixins.json"

[[mixins]]
config="lrtactical.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="iris"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
